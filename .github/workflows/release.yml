name: Release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get project version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get artifactId from pom.xml
        id: get_artifact
        run: |
          ARTIFACT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          echo "ARTIFACT=${ARTIFACT}"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: |
          mvn -q -DskipTests package
          cp target/${{ steps.get_artifact.outputs.ARTIFACT }}-${{ steps.get_version.outputs.VERSION }}.jar ./gielme.jar

      - name: Prepare release package
        run: |
          mkdir dist
          cp gielme.jar dist/
          cp release/scripts/install.sh dist/
          cp release/scripts/uninstall.sh dist/
          cd dist
          tar -czf gielme-${{ steps.get_version.outputs.VERSION }}.tar.gz *
          mv gielme-${{ steps.get_version.outputs.VERSION }}.tar.gz ..

      - name: Upload archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gielme-${{ steps.get_version.outputs.VERSION }}.tar.gz